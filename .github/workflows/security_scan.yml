name: Weekly security scan

on:
  schedule:
    - cron: '0 6 * * 1'   # Mondays 06:00 UTC
  workflow_dispatch:

jobs:
  full_security_audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        run: pip install uv==0.11.13
      - run: uv sync --frozen

      - name: Bandit (full ruleset)
        run: uv run bandit -r agentforge -ll
        continue-on-error: true

      - name: Semgrep
        uses: returntocorp/semgrep-action@v1
        with:
          config: p/python p/security-audit p/owasp-top-ten
        continue-on-error: true

      - name: pip-audit
        run: |
          uv pip compile pyproject.toml --quiet -o requirements.txt
          pip install pip-audit
          pip-audit --requirement requirements.txt
        continue-on-error: true

      - name: Hadolint (Dockerfile lint)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
        continue-on-error: true

      - name: Trivy filesystem (HIGH+CRITICAL)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          severity: HIGH,CRITICAL
          format: 'sarif'
          output: 'trivy-fs.sarif'
        continue-on-error: true

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs.sarif
        continue-on-error: true
