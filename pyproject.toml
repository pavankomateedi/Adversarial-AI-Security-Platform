[project]
name = "agentforge"
version = "1.0.0"
description = "Multi-agent adversarial evaluation platform for AI-assisted healthcare (OpenEMR Clinical Co-Pilot)"
authors = [{ name = "pavan.kom", email = "pavan.kom@gmail.com" }]
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "redis>=5.2",
    "slowapi>=0.1.9",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt<5",
    "httpx>=0.28",
    "tenacity>=9.0",
    "langchain>=0.3",
    "langgraph>=0.2.50",
    "langchain-anthropic>=0.3",
    "langchain-groq>=0.2",
    "langchain-openai>=0.2",
    "langfuse>=2.55",
    "opentelemetry-sdk>=1.28",
    "structlog>=24.4",
    "prometheus-client>=0.21",
    "python-multipart>=0.0.20",
    "greenlet>=3.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.13",
    "bandit>=1.8",
    "detect-secrets>=1.5",
    "aiosqlite>=0.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agentforge"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "SIM"]
ignore = ["S101", "S104"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]
"agentforge/db/migrations/**" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["jose.*", "passlib.*", "slowapi.*", "langfuse.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live: tests that hit the deployed Clinical Co-Pilot (skipped in CI)",
]
