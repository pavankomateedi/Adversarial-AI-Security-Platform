[project]
name = "agentforge"
version = "1.0.0"
description = "Multi-agent adversarial evaluation platform for AI-assisted healthcare (OpenEMR Clinical Co-Pilot)"
authors = [{ name = "pavan.kom", email = "pavan.kom@gmail.com" }]
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "redis>=5.2",
    "slowapi>=0.1.9",
    "python-jose[cryptography]>=3.3",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt<5",
    "httpx>=0.28",
    "tenacity>=9.0",
    "langchain>=0.3",
    "langgraph>=0.2.50",
    "langchain-anthropic>=0.3",
    "langchain-groq>=0.2",
    "langchain-openai>=0.2",
    "langfuse>=2.55",
    "opentelemetry-sdk>=1.28",
    "structlog>=24.4",
    "prometheus-client>=0.21",
    "python-multipart>=0.0.20",
    "greenlet>=3.1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "ruff>=0.8",
    "mypy>=1.13",
    "bandit>=1.8",
    "detect-secrets>=1.5",
    "aiosqlite>=0.20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agentforge"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S", "SIM"]
# E501 — long lines tolerated; many lines are necessarily long (inline HTML,
#        Prometheus label strings, structured log calls). Width is set to 120
#        but we don't fail CI on overruns.
# S311 — non-cryptographic random.random() is fine for Judge cross-check sampling.
# S104 — 0.0.0.0 bind is the Railway runtime; we don't bind in test code.
# B008 — Depends(...) at function-default is the FastAPI idiom.
# S110/SIM105 — try/except/pass is intentional in fail-soft paths (audit log,
#               langfuse, prom metrics — never let observability break the request).
# UP042 — StrEnum requires Python 3.11+ for clean subclassing; we keep (str, Enum)
#         for compatibility with pydantic v2 + json schema generation.
ignore = [
    "E501", "S101", "S104", "S311", "B008",
    "S105", "S106", "S107",
    "S110", "SIM105",
    "UP042",
    "ASYNC230",  # YAML read in eval runner is sync but short and one-shot
    "S602",      # one subprocess call in scripts/ for railway CLI invocation
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501", "S105", "S106", "S311", "B017"]
"scripts/**" = ["E501", "S105", "S106", "T201"]
"agentforge/db/migrations/**" = ["E501"]
"agentforge/main.py" = ["E501"]      # inline HTML templates
"agentforge/templates.py" = ["E501"] # inline HTML templates
"agentforge/security/waf.py" = ["RUF001"]  # bidi-detector regex needs the chars

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["jose.*", "passlib.*", "slowapi.*", "langfuse.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live: tests that hit the deployed Clinical Co-Pilot (skipped in CI)",
]

[tool.bandit]
# Skip low-severity findings on the principle "alert on what matters"; LOW
# in bandit is dominated by `assert` usage and standard-library randomness,
# neither of which is exploitable in this codebase.
# B404/B412/B613 — the WAF regex contains the bidi/control characters it's
#                 trying to *detect*. The whole point of the file is to
#                 recognize them; bandit would otherwise flag the source.
skips = ["B101", "B311", "B105", "B106", "B107", "B110", "B404", "B412", "B613"]
exclude_dirs = ["tests", "scripts", "evals"]
